<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMatch | Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#FFFDF9] text-[#333333] font-sans flex flex-col min-h-screen">
  <nav class="bg-[#FFFDF9] border-b border-gray-200 sticky top-0 z-50 px-6 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="text-xl font-extrabold tracking-tight">TECH<span class="text-[#86CFFF]">MATCH</span></div>
      <div class="hidden lg:flex space-x-6 font-medium text-sm">
        <a href="../index.html" class="hover:text-[#86CFFF] transition-colors">Home</a>
        <a href="catalog.html" class="hover:text-[#86CFFF] transition-colors">Catalog</a>
        <a href="matchmaker.html" class="hover:text-[#86CFFF] transition-colors">Matchmaker</a>
        <a href="compare.html" class="hover:text-[#86CFFF] transition-colors">Compare</a>
        <a href="guides.html" class="hover:text-[#86CFFF] transition-colors">Guides</a>
        <a href="faq.html" class="hover:text-[#86CFFF] transition-colors">FAQ</a>
        <a href="reviews.html" class="hover:text-[#86CFFF] transition-colors">Reviews</a>
        <a href="about.html" class="hover:text-[#86CFFF] transition-colors">About Us</a>
        <a href="contact.html" class="text-[#86CFFF] border-b-2 border-[#86CFFF] pb-1">Contact</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full">
    <div class="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm">
      <h1 class="text-3xl font-extrabold mb-4">Get in Touch</h1>
      <p class="text-[#777777] mb-6">Have a question or a specific configuration request? Send us a message.</p>
      
      <form class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-[#777777] mb-2">Name</label>
          <input type="text" placeholder="Your name" class="w-full bg-[#FFFDF9] border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#86CFFF]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#777777] mb-2">Message</label>
          <textarea rows="4" placeholder="How can we help?" class="w-full bg-[#FFFDF9] border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#86CFFF]"></textarea>
        </div>
        <button type="button" class="w-full bg-[#86CFFF] hover:bg-[#6bbcf5] text-white font-bold px-4 py-3 rounded-xl transition-colors">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="bg-white border-t border-gray-200 py-8 text-center text-[#777777] text-sm mt-auto">
    <p>&copy; 2026 TechMatch. All rights reserved.</p>
  </footer>
  <script src="../assets/JS/script.js"></script>
</body>
</html>
