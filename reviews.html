<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMatch | Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-[#FFFDF9] text-[#333333] font-sans flex flex-col min-h-screen">
  
  <nav class="bg-[#FFFDF9] border-b border-gray-200 sticky top-0 z-50 px-6 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="text-xl font-extrabold tracking-tight">TECH<span class="text-[#86CFFF]">MATCH</span></div>
      
      <div class="hidden lg:flex space-x-6 font-medium text-sm">
        <a href="../index.html" class="hover:text-[#86CFFF] transition-colors">Home</a>
        <a href="catalog.html" class="hover:text-[#86CFFF] transition-colors">Catalog</a>
        <a href="matchmaker.html" class="hover:text-[#86CFFF] transition-colors">Matchmaker</a>
        <a href="compare.html" class="hover:text-[#86CFFF] transition-colors">Compare</a>
        <a href="guides.html" class="hover:text-[#86CFFF] transition-colors">Guides</a>
        <a href="faq.html" class="hover:text-[#86CFFF] transition-colors">FAQ</a>
        <a href="reviews.html" class="text-[#86CFFF] border-b-2 border-[#86CFFF] pb-1">Reviews</a>
        <a href="about.html" class="hover:text-[#86CFFF] transition-colors">About Us</a>
        <a href="contact.html" class="hover:text-[#86CFFF] transition-colors">Contact</a>
      </div>

      <button id="mobileMenuBtn" class="lg:hidden text-[#333333] focus:outline-none hover:text-[#86CFFF] transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <div id="mobileMenu" class="hidden mt-4 flex-col space-y-3 pb-4 font-medium border-t border-gray-100 pt-4 lg:hidden">
      <a href="../index.html" class="block hover:text-[#86CFFF] transition-colors">Home</a>
      <a href="catalog.html" class="block hover:text-[#86CFFF] transition-colors">Catalog</a>
      <a href="matchmaker.html" class="block hover:text-[#86CFFF] transition-colors">Matchmaker</a>
      <a href="compare.html" class="block hover:text-[#86CFFF] transition-colors">Compare</a>
      <a href="guides.html" class="block hover:text-[#86CFFF] transition-colors">Guides</a>
      <a href="faq.html" class="block hover:text-[#86CFFF] transition-colors">FAQ</a>
      <a href="reviews.html" class="block text-[#86CFFF]">Reviews</a>
      <a href="about.html" class="block hover:text-[#86CFFF] transition-colors">About Us</a>
      <a href="contact.html" class="block hover:text-[#86CFFF] transition-colors">Contact</a>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full space-y-12">
    <div>
      <h1 class="text-4xl font-extrabold mb-2 text-center">Community Reviews</h1>
      <p class="text-[#777777] text-center">See what others are saying or leave your own feedback.</p>
    </div>

    <!-- Review Form Section -->
    <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-gray-200 shadow-sm">
      <h2 class="text-2xl font-bold mb-4">Leave a Review</h2>
      <form id="reviewForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-[#777777] mb-1">Your Name</label>
          <input type="text" id="reviewerName" placeholder="e.g., Jordan Lee" required class="w-full bg-[#FFFDF9] border border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#86CFFF]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#777777] mb-1">Rating</label>
          <select id="reviewerRating" class="w-full bg-[#FFFDF9] border border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#86CFFF]">
            <option value="5">★★★★★ (5/5)</option>
            <option value="4">★★★★☆ (4/5)</option>
            <option value="3">★★★☆☆ (3/5)</option>
            <option value="2">★★☆☆☆ (2/5)</option>
            <option value="1">★☆☆☆☆ (1/5)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#777777] mb-1">Your Review</label>
          <textarea id="reviewerText" rows="3" placeholder="Write your experience..." required class="w-full bg-[#FFFDF9] border border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#86CFFF]"></textarea>
        </div>
        <button type="submit" class="w-full bg-[#86CFFF] hover:bg-[#6ab4e8] text-white font-bold py-3 rounded-xl transition-colors">Submit Review</button>
      </form>
    </div>

    <!-- Dynamic Reviews Grid -->
    <div>
      <h2 class="text-2xl font-bold mb-6">Recent Feedback</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="reviewsGrid"></div>
    </div>
  </main>

  <footer class="bg-white border-t border-gray-200 py-8 text-center text-[#777777] text-sm mt-auto">
    <p>&copy; 2026 TechMatch. All rights reserved.</p>
  </footer>
  
  <script src="../assets/JS/script.js"></script>
</body>
</html>
